image:
  repository: ghcr.io/platform-engineer-lab/sample-service
  tag: d446bfc
  pullPolicy: IfNotPresent
service:
  port: 8080
replicaCount: 1
hostname: ""
probe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
  liveness: true
gateway:
  name: podinfo
  namespace: podinfo
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
rollout:
  canary:
    steps:
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# OpenTelemetry auto-instrumentation (OTel Operator injects the Go eBPF sidecar;
# it needs the target binary path and shareProcessNamespace, which the operator
# sets automatically).
podAnnotations:
  resource.opentelemetry.io/service.name: "sample-service"
  instrumentation.opentelemetry.io/inject-go: "business-apps/platform"
  instrumentation.opentelemetry.io/otel-go-auto-target-exe: "/sample-service"
